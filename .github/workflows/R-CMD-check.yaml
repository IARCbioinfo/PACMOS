name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: pacmos_env.yml
          activate-environment: pacmos_env
          auto-activate-base: false

      - name: Set PACMOS_PYTHON on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: |
          echo "PACMOS_PYTHON=$CONDA_PREFIX/bin/python" >> $GITHUB_ENV
          which python
          python -c "import mofapy2, numpy, pandas, sklearn; print('Python OK')"

      - name: Set PACMOS_PYTHON on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "PACMOS_PYTHON=$env:CONDA_PREFIX\python.exe" >> $env:GITHUB_ENV
          where.exe python
          python -c "import mofapy2, numpy, pandas, sklearn; print('Python OK')"


      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::knitr
            any::rmarkdown
          needs: check
          dependencies: '"Imports"'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
